contract_version: 1
name: xk-ingest-helper
purpose: >-
  Defines the structured boundary between the Claude Code `/xk-ingest`
  command/runtime orchestrator and the thin helper responsible for validation
  and atomic commit. The project relies on the active Claude session to produce
  mutation content; the helper/runtime side is local-only and must not actively
  invoke Claude on its own.

input:
  type: object
  required:
    - raw_document
    - knowledge_mutation_set
    - target_roots
  properties:
    raw_document:
      type: object
      required: [raw_id, source_path, ingest_allowed]
      properties:
        raw_id:
          type: string
        source_path:
          type: string
        ingest_allowed:
          type: boolean
    knowledge_mutation_set:
      type: object
      required:
        - raw_chunks
        - wiki_page_draft
        - index_draft
        - link_draft
        - log_draft
        - completeness_report
      properties:
        raw_chunks:
          type: array
        wiki_page_draft:
          type: object
        index_draft:
          type: array
        link_draft:
          type: array
        log_draft:
          type: object
        completeness_report:
          type: object
    target_roots:
      type: object
      required: [wiki_root, log_root, system_root]
      properties:
        wiki_root:
          type: string
        log_root:
          type: string
        system_root:
          type: string

validation_rules:
  - reject_when_raw_not_approved
  - reject_when_required_mutation_parts_missing
  - reject_when_no_valid_raw_citations
  - reject_when_completeness_report_empty
  - reject_when_target_paths_cannot_be_materialized

commit_behavior:
  mode: atomic
  writes:
    - wiki_page
    - global_index
    - global_link
    - log_entry
  merge_policy:
    global_index:
      strategy: merge-preserving
      preserve_existing_entries: true
      allow_deduplication: true
      treat_input_as_incremental: true
    global_link:
      strategy: merge-preserving
      preserve_existing_entries: true
      allow_deduplication: true
      treat_input_as_incremental: true
    log_entry:
      strategy: append-or-merge-preserving
      preserve_same_day_history: true
      allow_deduplication: true
      treat_input_as_incremental: true
  rollback_on_any_failure: true

merge_semantics:
  index_draft: incremental patch for `WIKI/INDEX.md`, not a whole-file snapshot
  link_draft: incremental patch for `WIKI/LINK.md`, not a whole-file snapshot
  log_draft: incremental patch for `LOG/<date>.md`, must preserve same-day history
  session_boundary:
    - mutation generation is performed by the active Claude session, not by the local helper/runtime
    - helper/runtime must only consume already-produced mutation content and perform local validation/commit
  non_goals:
    - helper must not remove unrelated historical entries during a successful ingest
    - helper must not rewrite same-day log file as a single-entry snapshot
    - helper/runtime must not actively invoke Claude SDK, Claude CLI, or any internal secondary Claude call chain

output:
  type: object
  required:
    - status
    - rolled_back
    - diagnostics
  properties:
    status:
      type: string
      enum: [committed, rejected, failed]
    rolled_back:
      type: boolean
    written_paths:
      type: array
      items:
        type: string
    diagnostics:
      type: array
      items:
        type: string
